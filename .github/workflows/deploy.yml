name: Deploy to GitHub Pages

# Builds the static export and publishes it to the public Pages repo
# (salahu01/ward-logistics → https://salahu01.github.io/ward-logistics/).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ward-logistics
          NEXT_PUBLIC_SITE_URL: https://salahu01.github.io/ward-logistics

      - name: Publish to salahu01/ward-logistics
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: salahu01/ward-logistics
          publish_branch: main
          publish_dir: ./out
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual run' }}"
