name: Deploy to GitHub Pages

# Builds the static export and publishes it with GitHub Pages
# (salahu01/ward-logistics → https://salahu01.github.io/ward-logistics/).
# Manual for now: enable Pages (Source: GitHub Actions) in repo settings first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ward-logistics
          NEXT_PUBLIC_SITE_URL: https://salahu01.github.io/ward-logistics

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - id: deployment
        uses: actions/deploy-pages@v4
